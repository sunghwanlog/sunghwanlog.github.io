<!-- =========================
     COMMON HEADER
========================= -->

<header>

  <div class="container">

    <nav>

      <div class="logo">
        <a href="{{ '/' | relative_url }}">
          In Passing
        </a>
      </div>


      <div class="menu">


        <div class="menu-item">
          <a
            href="{{ '/' | relative_url }}"
            {% if page.url == "/" %}class="active"{% endif %}
          >
            Home
          </a>
        </div>


        <div class="menu-item">
          <a
            href="{{ '/about.html' | relative_url }}"
            {% if page.url == "/about.html" %}class="active"{% endif %}
          >
            About
          </a>
        </div>


        <div class="menu-item">
          <a
            href="{{ '/photography.html' | relative_url }}"
            {% if page.url == "/photography.html" or page.category == "photography" %}class="active"{% endif %}
          >
            Photography
          </a>
        </div>


        <div class="menu-item">
          <a
            href="{{ '/daily.html' | relative_url }}"
            {% if page.url == "/daily.html" or page.category == "daily" %}class="active"{% endif %}
          >
            Daily
          </a>
        </div>


        <!-- ACTIVITY -->

        <div class="menu-item activity-menu">

          <a
            href="{{ '/running.html' | relative_url }}"
            {% if page.url == "/running.html"
              or page.url == "/hiking.html"
              or page.category == "running"
              or page.category == "hiking"
            %}class="active"{% endif %}
          >
            Activity
          </a>


          <div class="dropdown">

            <a
              href="{{ '/running.html' | relative_url }}"
              {% if page.url == "/running.html"
                or page.category == "running"
              %}class="active"{% endif %}
            >
              Running
            </a>

            <a
              href="{{ '/hiking.html' | relative_url }}"
              {% if page.url == "/hiking.html"
                or page.category == "hiking"
              %}class="active"{% endif %}
            >
              Hiking
            </a>

          </div>

        </div>


        <div class="menu-item">
          <a
            href="{{ '/reflections.html' | relative_url }}"
            {% if page.url == "/reflections.html" or page.category == "reflections" %}class="active"{% endif %}
          >
            Reflections
          </a>
        </div>


        <div class="menu-item">
          <a
            href="{{ '/thoughts.html' | relative_url }}"
            {% if page.url == "/thoughts.html" or page.category == "thoughts" %}class="active"{% endif %}
          >
            Thoughts
          </a>
        </div>


        <div class="menu-item">
          <a
            href="{{ '/moments.html' | relative_url }}"
            {% if page.url == "/moments.html" or page.category == "moments" %}class="active"{% endif %}
          >
            Moments
          </a>
        </div>


      </div>

    </nav>

  </div>

</header>
